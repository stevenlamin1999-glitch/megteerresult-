name: Update Daily Dates in Titles

on:
  schedule:
    - cron: '30 0 * * 1-6'
  workflow_dispatch:

jobs:
  update-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dates in HTML files and sitemap
        run: |
          DATE=$(date +'%d %b %Y')
          ISODATE=$(date +'%Y-%m-%d')
          echo "Today: $DATE | ISO: $ISODATE"

          FILES=(
            "index.html"
            "shillong-teer-result.html"
            "khanapara-teer-result.html"
            "laitlynkot-teer-result.html"
            "jowai-ladrymbai-teer-result.html"
          )

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              sed -i "s/\[ [0-9]\{2\} [A-Za-z]\{3\} [0-9]\{4\} \]/[ $DATE ]/g" "$FILE"
              echo "Updated: $FILE"
            fi
          done

          if [ -f "sitemap.xml" ]; then
            sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>$ISODATE<\/lastmod>/g" sitemap.xml
            echo "Updated sitemap.xml to $ISODATE"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html shillong-teer-result.html khanapara-teer-result.html laitlynkot-teer-result.html jowai-ladrymbai-teer-result.html sitemap.xml
          git diff --staged --quiet || git commit -m "Auto update: dates $(date +'%d %b %Y')"
          git push
