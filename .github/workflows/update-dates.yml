name: Update Daily Dates in Titles

on:
  schedule:
    - cron: '30 0 * * 1-6'   # 6:00 AM IST (00:30 UTC) Monday to Saturday
  workflow_dispatch:         # Allows manual run from Actions tab

jobs:
  update-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dates in HTML files
        run: |
          # Get today's date in the format: 28 Sep 2026
          DATE=$(date +'%d %b %Y')
          echo "Updating titles to: $DATE"

          # List of files that contain the date in the title
          FILES=(
            "index.html"
            "shillong-teer-result.html"
            "khanapara-teer-result.html"
            "laitlynkot-teer-result.html"
            "jowai-ladrymbai-teer-result.html"
          )

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              # This replaces any date that looks like [ 01 Sep 2026 ] with today's date
              sed -i -E "s/\[ [0-9]{1,2} [A-Za-z]{3} [0-9]{4} \]/[ $DATE ]/g" "$FILE"
              echo "✅ Updated: $FILE"
            else
              echo "⚠️ File not found: $FILE"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html shillong-teer-result.html khanapara-teer-result.html laitlynkot-teer-result.html jowai-ladrymbai-teer-result.html
          git diff --staged --quiet || git commit -m "Auto update dates to $(date +'%d %b %Y')"
          git push
